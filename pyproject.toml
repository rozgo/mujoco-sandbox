[project]
name = "sixlegs"
version = "0.1.0"
description = "A dual-arm hexapod manipulation scene in MuJoCo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sixlegs = "sixlegs.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
