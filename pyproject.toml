[project]
name = "sixlegs"
version = "0.1.0"
description = "Physical hexapod manipulation and RC-rover communications demos in MuJoCo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "imageio-ffmpeg>=0.6,<1",
    "mujoco>=3.12,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sixlegs = "sixlegs.cli:main"
rover-comms = "sixlegs.rovers.cli:main"
amphibious = "sixlegs.amphibious.cli:main"
wind-demo = "sixlegs.wind.cli:main"

[project.optional-dependencies]
reticulum = [
    "rns>=1.5.2,<1.6",
]
wind = [
    "matplotlib>=3.10,<4",
    "neuraloperator>=2.0,<3",
    "scipy>=1.15,<2",
    "torch>=2.8,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
neuraloperator = { git = "https://github.com/neuraloperator/neuraloperator.git", rev = "00b7d86f8d74ff0af55da53eb585fe26df9c71f0" }
