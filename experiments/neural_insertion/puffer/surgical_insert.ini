[base]
env_name = surgical_insert

[vec]
# Same world layout as surgical_align (2 MB MuJoCo arena per world, about 5 GB for 2048 worlds).
total_agents = 2048
num_buffers = 2
num_threads = 28

[env]
# Training seed base; evaluation uses separate predetermined seeds (insert_env.py, 2,000,000+).
seed = 1
# Disturbance layer, scale v2: level 1 nominal quality workcell, 2 stress; each episode's level is
# drawn uniformly in [0, 2]. Site, phantom rotation, placed threads and thread-end offset are random.
disturbance = 2.0
disturbance_mode = 1

[policy]
hidden_size = 128
num_layers = 2

[train]
# Starts from the settings that trained the robust alignment policy (align_v6): learning rate 0.001
# (0.003 diverged under disturbances, align_v4) and a 300 M step budget.
total_timesteps = 300_000_000
learning_rate = 0.001
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.0005
horizon = 64
minibatch_size = 16384
