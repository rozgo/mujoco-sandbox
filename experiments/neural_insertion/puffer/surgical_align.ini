[base]
env_name = surgical_align

[vec]
# Each world holds a 2 MB MuJoCo arena; 2048 worlds use about 5 GB of host memory.
total_agents = 2048
num_buffers = 2
num_threads = 28

[env]
# Training seed base; evaluation uses separate predetermined seeds (align_env.py).
seed = 1
# Disturbance layer (brief v2), scale v2: level 1 nominal quality workcell, 2 stress.
# Each episode's level is drawn uniformly in [0, 2].
disturbance = 2.0
disturbance_mode = 1

[policy]
hidden_size = 128
num_layers = 2

[train]
# align_v5 (0.001, 100 M) was stable but still improving when the cosine
# schedule reached zero: 62.5% / 26.5% / 0.5% success at levels 0 / 0.5 / 1,
# successes taking 4.5 of the 5 s. The only change for align_v6 is a 300 M
# step budget, which keeps the annealed rate higher for longer.
total_timesteps = 300_000_000
# align_v2 diverged at the default 0.015 once action noise shrank (KL 0.16 -> 300
# between 12.7 M and 15.9 M steps); the only change for align_v3 is this rate.
# align_v4 (disturbances on, 0.003) diverged the same way: KL 0.1 -> 14 between
# 35 M and 48 M steps. The only change for align_v5 is this rate.
learning_rate = 0.001
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.0005
horizon = 64
minibatch_size = 16384
