[project]
name = "adaptive-locomotion"
version = "0.1.0"
description = "MuJoCo PPO locomotion with a frozen single-policy limb-loss baseline"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mujoco==3.13.0", "mjbatch==0.1.0", "numpy==2.5.3",
  "torch==2.14.0", "pillow>=12,<13", "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
warp = ["mujoco-warp==3.13.0", "warp-lang==1.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15"]

[tool.uv.sources]
mjbatch = { path = "third_party/mjbatch" }

[project.scripts]
adaptive-dog = "adaptive_locomotion.cli:main"
adaptive-moving = "adaptive_locomotion.moving_cli:main"
adaptive-balance = "adaptive_locomotion.standing_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
