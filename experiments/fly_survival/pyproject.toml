[project]
name = "fly-survival"
version = "0.1.0"
description = "Embodied multi-agent utility learning with NeuroMechFly and MaleCNS"
requires-python = ">=3.14,<3.15"
dependencies = [
  "flygym==2.1.0", "numpy>=2,<3", "scipy>=1.15,<2",
  "pillow>=12,<13", "imageio-ffmpeg==0.6.0",
  "pyarrow>=21", "pandas>=2.2,<4", "numba>=0.65.1",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13", "warp-lang>=1.14,<1.15", "mujoco-warp>=3.9,<3.10"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fly-survival = "fly_survival.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
