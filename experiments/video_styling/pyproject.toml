[project]
name = "mujoco-video-styling"
version = "0.1.0"
description = "WaveSpeed video-editing trials with preserved MuJoCo source footage"
requires-python = ">=3.14,<3.15"
dependencies = [
    "wavespeed>=2.0.2,<3",
    "python-dotenv>=1.2.3,<2",
    "httpx>=0.28.1,<1",
    "imageio-ffmpeg>=0.6.0,<1",
    "pillow>=12.3.0,<13",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.7,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
style-video = "video_styling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_styling"]

[tool.ruff]
target-version = "py314"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I"]
